<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" fill="none">
  <!-- 空狀態插畫：線稿機架＋小扳手，cyan 細線、極簡 -->
  <g stroke="#22D3EE" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <!-- 機架外框 -->
    <rect x="120" y="40" width="160" height="220" rx="12" fill="none"/>
    <!-- 空的 U 位（虛線） -->
    <g stroke-dasharray="6 6" opacity="0.55">
      <rect x="140" y="62" width="120" height="18" rx="4" fill="none"/>
      <rect x="140" y="90" width="120" height="18" rx="4" fill="none"/>
      <rect x="140" y="118" width="120" height="18" rx="4" fill="none"/>
      <rect x="140" y="146" width="120" height="18" rx="4" fill="none"/>
      <rect x="140" y="174" width="120" height="18" rx="4" fill="none"/>
      <rect x="140" y="202" width="120" height="18" rx="4" fill="none"/>
      <rect x="140" y="230" width="120" height="16" rx="4" fill="none"/>
    </g>
    <!-- 立柱孔位 -->
    <g opacity="0.4">
      <path d="M132 56 V244 M268 56 V244" stroke-dasharray="2 8"/>
    </g>
  </g>
  <!-- 小扳手 -->
  <g stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M298 224 a16 16 0 1 0 22 22 l-10 10 -8 -8 10 -10 a16 16 0 0 0 -14 -14 z" fill="#0B1220"/>
    <path d="M300 246 L272 274"/>
  </g>
  <!-- 狀態燈 -->
  <circle cx="152" cy="71" r="3" fill="#F59E0B"/>
  <circle cx="152" cy="99" r="3" fill="#22D3EE" opacity="0.5"/>
</svg>
